# this configuraion shamelessly stolen from compiler-explorer
# https://github.com/compiler-explorer/compiler-explorer/blob/27df8fe72e3f306823ac1bc438a60bf29590c621/etc/nsjail/user-execution.cfg

name: "swadidik sandbox"

mode: ONCE
hostname: "swadidik"

envar: "LD_LIBRARY_PATH=/opt/jdk/lib"

time_limit: 5

rlimit_as_type: INF
rlimit_cpu_type: SOFT
rlimit_fsize: 16 # 16 MiB
rlimit_nofile: 300
rlimit_nproc: 20

detect_cgroupv2: true

# cgroup_mem_parent: "swadidik"
# cgroup_pids_parent: "swadidik"
# cgroup_net_cls_parent: "swadidik"
# cgroup_cpu_parent: "swadidik"

# cgroupv2_mount: "/sys/fs/cgroup/swadidik"

cgroup_mem_max: 209715200 # 200 MiB
cgroup_mem_swap_max: 0
cgroup_pids_max: 200
cgroup_cpu_ms_per_sec: 500


uidmap {
    inside_id: "0"
    outside_id: "65534"
}

gidmap {
    inside_id: "0"
    outside_id: "65534"
}

# mount {
#     src_content: "swadidik:x:10240:10240:Not a real account:/app:/bin/bash"
#     dst: "/etc/passwd"
#     is_bind: true
# }

# mount {
#     src: "/etc/ld.so.cache"
#     dst: "/etc/ld.so.cache"
#     is_bind: true
#     rw: false
# }

mount {
    src: "/opt/jdk"
    dst: "/opt/jdk"
    is_bind: true
    rw: false
}

mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib64"
    dst: "/usr/lib64"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/share/zoneinfo"
    dst: "/usr/share/zoneinfo"
    is_bind: true
    mandatory: false
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
    rw: false
}

mount {
    src: "/lib32"
    dst: "/lib32"
    is_bind: true
    mandatory: false
    rw: false
}

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    options: "size=100m,nr_inodes=100"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}

mount {
    dst: "/dev"
    fstype: "tmpfs"
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    rw: true
    is_bind: true
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/random"
    is_bind: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
}

mount {
    dst: "/dev/shm"
    fstype: "tmpfs"
    rw: true
    is_bind: false
    options: "size=40m"
}

# mount {
